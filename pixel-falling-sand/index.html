<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Falling Sand</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>PIXEL SANDBOX</h1>
            <p class="subtitle">Paint elements • Watch them interact</p>
        </header>
        
        <main class="game-area">
            <div class="canvas-wrapper">
                <canvas id="sandbox"></canvas>
                <div class="canvas-overlay"></div>
            </div>
            
            <aside class="controls">
                <div class="element-selector">
                    <h2>ELEMENTS</h2>
                    <div class="element-buttons">
                        <button class="element-btn active" data-element="sand">
                            <span class="element-icon sand-icon"></span>
                            <span class="element-name">SAND</span>
                        </button>
                        <button class="element-btn" data-element="water">
                            <span class="element-icon water-icon"></span>
                            <span class="element-name">WATER</span>
                        </button>
                        <button class="element-btn" data-element="stone">
                            <span class="element-icon stone-icon"></span>
                            <span class="element-name">STONE</span>
                        </button>
                        <button class="element-btn" data-element="acid">
                            <span class="element-icon acid-icon"></span>
                            <span class="element-name">ACID</span>
                        </button>
                        <button class="element-btn" data-element="fire">
                            <span class="element-icon fire-icon"></span>
                            <span class="element-name">FIRE</span>
                        </button>
                        <button class="element-btn" data-element="wood">
                            <span class="element-icon wood-icon"></span>
                            <span class="element-name">WOOD</span>
                        </button>
                        <button class="element-btn" data-element="oil">
                            <span class="element-icon oil-icon"></span>
                            <span class="element-name">OIL</span>
                        </button>
                        <button class="element-btn erase" data-element="erase">
                            <span class="element-icon erase-icon"></span>
                            <span class="element-name">ERASE</span>
                        </button>
                    </div>
                </div>
                
                <div class="brush-controls">
                    <h2>BRUSH SIZE</h2>
                    <input type="range" id="brush-size" min="1" max="20" value="5">
                    <span class="brush-value" id="brush-value">5</span>
                </div>
                
                <div class="action-buttons">
                    <button id="clear-btn" class="action-btn">CLEAR ALL</button>
                    <button id="pause-btn" class="action-btn">PAUSE</button>
                </div>
                
                <div class="stats">
                    <div class="stat">
                        <span class="stat-label">PARTICLES</span>
                        <span class="stat-value" id="particle-count">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">FPS</span>
                        <span class="stat-value" id="fps">60</span>
                    </div>
                </div>
                
                <div class="legend">
                    <h2>INTERACTIONS</h2>
                    <ul>
                        <li><span class="dot acid-dot"></span> Acid dissolves stone & wood</li>
                        <li><span class="dot fire-dot"></span> Fire burns wood & oil</li>
                        <li><span class="dot water-dot"></span> Water extinguishes fire</li>
                    </ul>
                </div>
            </aside>
        </main>
        
        <footer>
            <p>Click and drag to paint • Keyboard: 1-8 to switch elements</p>
        </footer>
    </div>
    
    <script src="sandbox.js"></script>
</body>
</html>
